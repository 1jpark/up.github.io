<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c8ac61">
<title>Page not found | Upload Portal</title>
<link rel="icon" type="image/png" href="https://cdn.meson.one/f/up.meson.one/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="https://cdn.meson.one/f/up.meson.one/favicon.svg">
<link rel="shortcut icon" href="https://cdn.meson.one/f/up.meson.one/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="https://cdn.meson.one/f/up.meson.one/apple-touch-icon.png">
<noscript><meta http-equiv="refresh" content="10;url=/"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light dark;
  --bg:#f3f0ea;--surface:#fbfaf7;--tonal:#e9e5db;--outline:#d8d2c4;
  --ink:#26302f;--ink2:#556160;--ink3:#76827f;
  --primary:#3f6b6e;--primary-c:#d4e4e2;--on-primary:#fff;--birch:#c8ac61;
  --sky:#e6e1d4;--hill1:#cdd6cb;--hill2:#a9bcb4;--hill3:#7b9a98;--hill4:#3f6b6e;--cloud:#fbfaf7;
  --e2:0 2px 6px rgba(38,48,47,.12),0 10px 24px rgba(38,48,47,.08);
  --font:'Albert Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a2120;--surface:#232b2a;--tonal:#2c3635;--outline:#3b4846;
  --ink:#e8ece9;--ink2:#b2bdba;--ink3:#8a9794;
  --primary:#8fc1c3;--primary-c:#2f4b4d;--on-primary:#12302f;
  --sky:#2a3433;--hill1:#33403e;--hill2:#3d4f4c;--hill3:#4b6764;--hill4:#6f9c9b;--cloud:#3a4846;
  --e2:0 4px 20px rgba(0,0,0,.5);
}}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:10px}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;letter-spacing:normal;white-space:nowrap;font-feature-settings:'liga';user-select:none;flex-shrink:0}
.card{width:min(100%,480px);background:var(--surface);border-radius:28px;box-shadow:var(--e2);overflow:hidden;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.scene{background:var(--sky);aspect-ratio:16/8}
.scene svg{display:block;width:100%;height:100%}
.body{padding:28px 28px 24px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.brand .ms{font-size:20px;color:var(--primary)}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:12px}
.lead{margin-top:10px;color:var(--ink2);font-size:16px}
.path{display:inline-block;max-width:100%;margin-top:16px;padding:6px 12px;border-radius:12px;background:var(--tonal);font:400 13px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.count{display:flex;align-items:center;gap:16px;margin-top:24px;padding:14px 16px;border-radius:20px;background:var(--primary-c)}
.count[hidden]{display:none}
.ring{position:relative;width:52px;height:52px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .t{stroke:color-mix(in srgb,var(--primary) 22%,transparent)}
.ring .p{stroke:var(--primary);stroke-dasharray:132;stroke-dashoffset:0;transition:stroke-dashoffset 10s linear}
.ring .p.run{stroke-dashoffset:132}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 18px var(--mono)}
.count p{font-size:14px;color:var(--ink);font-weight:500}
.paused{margin-top:24px;font-size:14px;color:var(--ink2)}
.paused[hidden]{display:none}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;font:600 14px var(--font);border:0;cursor:pointer;text-decoration:none;transition:box-shadow .2s var(--ease),background .2s}
.btn .ms{font-size:20px}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{box-shadow:var(--e2)}
.btn-text{background:transparent;color:var(--primary)}
.btn-text:hover{background:var(--primary-c)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 640 320" preserveAspectRatio="xMidYMid slice">
      <circle cx="500" cy="96" r="38" fill="var(--birch)"/>
      <path d="M0 200 Q100 140 210 188 T410 172 T640 192 V320 H0Z" fill="var(--hill1)"/>
      <path d="M0 232 Q130 186 260 224 T500 212 T640 232 V320 H0Z" fill="var(--hill2)"/>
      <path d="M0 266 Q160 230 320 262 T640 256 V320 H0Z" fill="var(--hill3)"/>
      <path d="M0 296 Q180 270 340 294 T640 288 V320 H0Z" fill="var(--hill4)"/>
      <g fill="var(--cloud)"><rect x="210" y="78" width="200" height="56" rx="28"/><rect x="255" y="48" width="92" height="64" rx="32"/><rect x="318" y="62" width="64" height="50" rx="25"/></g>
      <path d="M296 90 q0-16 14-16 q14 0 14 12 q0 9-11 14 q-4 3-4 10" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="309" cy="122" r="4.5" fill="var(--primary)"/>
      <g fill="var(--cloud)" opacity=".8"><rect x="64" y="56" width="80" height="18" rx="9"/><rect x="470" y="150" width="70" height="16" rx="8"/></g>
    </svg>
  </div>
  <div class="body">
    <div class="brand"><span class="ms" aria-hidden="true">cloud_upload</span>Upload Portal</div>
    <h1>Page not found</h1>
    <p class="lead">We couldn't find this address in the upload portal. The link may be mistyped or no longer in use.</p>
    <code class="path" id="path"></code>

    <div class="count" id="count" role="status">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle class="t" cx="26" cy="26" r="21"/><circle class="p" id="prog" cx="26" cy="26" r="21"/></svg>
        <b id="sec">10</b>
      </div>
      <p>Going to the main page in <span id="sec2">10</span> seconds</p>
    </div>
    <p class="paused" id="paused" hidden>Automatic redirect is paused.</p>

    <div class="actions">
      <button class="btn btn-text" type="button" id="stay">Stay here</button>
      <a class="btn btn-filled" href="/" id="go"><span class="ms" aria-hidden="true">home</span>Go to main page</a>
    </div>
  </div>
</main>
<script>
const TARGET='/';   /* where to send visitors */
const SECONDS=10;
const $=id=>document.getElementById(id);
$('path').textContent=location.pathname+location.search;
$('go').href=TARGET;
let left=SECONDS;
$('sec').textContent=$('sec2').textContent=left;
requestAnimationFrame(()=>requestAnimationFrame(()=>$('prog').classList.add('run')));
const timer=setInterval(()=>{
  left--;
  $('sec').textContent=$('sec2').textContent=Math.max(left,0);
  if(left<=0){clearInterval(timer);location.replace(TARGET)}
},1000);
$('stay').onclick=()=>{
  clearInterval(timer);
  $('count').hidden=true;$('paused').hidden=false;$('stay').hidden=true;
};
</script>
</body>
</html>
